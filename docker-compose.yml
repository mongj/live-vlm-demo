name: live-vlm-demo

services:
  server:
    build:
      context: ./web-server
    restart: unless-stopped
    init: true
    extra_hosts:
      - "host.docker.internal:host-gateway"
    environment:
      LIVE_VLM_HOST: "0.0.0.0"
      LIVE_VLM_PORT: "8787"
      LIVE_VLM_CONFIG: /app/config.toml
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
      JOYAI_BASE_URL: ${JOYAI_BASE_URL:-}
    volumes:
      - ${LIVE_VLM_CONFIG_FILE:-./docker/config.toml}:/app/config.toml:ro
    expose:
      - "8787"
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8787/health', timeout=3)",
        ]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 20s

  ui:
    build:
      context: ./web-ui
      args:
        VLM_GATEWAY_URL: http://server:8787
    restart: unless-stopped
    init: true
    environment:
      VLM_GATEWAY_URL: http://server:8787
      HOSTNAME: "0.0.0.0"
      PORT: "3000"
    expose:
      - "3000"
    depends_on:
      server:
        condition: service_healthy
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://127.0.0.1:3000/').then((r)=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))",
        ]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 20s

  proxy:
    image: caddy:2-alpine
    restart: unless-stopped
    ports:
      - "127.0.0.1:3099:3099"
    volumes:
      - ./docker/Caddyfile:/etc/caddy/Caddyfile:ro
    depends_on:
      ui:
        condition: service_healthy
      server:
        condition: service_healthy

networks:
  default:
    name: live-vlm-demo
